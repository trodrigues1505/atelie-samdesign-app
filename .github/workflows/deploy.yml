name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://tybscuxzvglsonexyius.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5YnNjdXh6dmdsc29uZXh5aXVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjIzNDEsImV4cCI6MjEwMTA5ODM0MX0.8xRw8a6DUmS3J7eBGAtZp9BrHethqLLVr3j4BRBvMXM"

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
